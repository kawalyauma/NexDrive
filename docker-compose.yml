services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexdrive}
      POSTGRES_USER: ${POSTGRES_USER:-nexdrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-nexdrive}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-nexdrive}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?Set BOOTSTRAP_TOKEN in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-268435456}
      DEFAULT_WORKSPACE_QUOTA_BYTES: ${DEFAULT_WORKSPACE_QUOTA_BYTES:-10737418240}
      STORAGE_DIR: /data
      STORAGE_MARKER_FILE: ${STORAGE_MARKER_FILE:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_GROUP: ${TELEGRAM_GROUP:-}
      TELEGRAM_SESSION: /telegram/notesug
      EDUSHARE_URL: ${EDUSHARE_URL:-}
      EDUSHARE_INTEGRATION_KEY: ${EDUSHARE_INTEGRATION_KEY:-}
      TELEGRAM_AUTO_START_WORKSPACE_ID: ${TELEGRAM_AUTO_START_WORKSPACE_ID:-}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-60}
      FRESH_TEACHER_WORKSPACE_ID: ${FRESH_TEACHER_WORKSPACE_ID:-}
      FRESH_TEACHER_REPOS: ${FRESH_TEACHER_REPOS:-primary:main:MIT,secondary:main:MIT}
      FRESH_TEACHER_POLL_SECONDS: ${FRESH_TEACHER_POLL_SECONDS:-900}
    volumes:
      - ${STORAGE_HOST_PATH:-nexdrive_data}:/data
      - ${TELEGRAM_SESSION_HOST_PATH:-./data/telegram-session}:/telegram
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  # Always-on Telegram importer: checks the group every TELEGRAM_POLL_SECONDS and imports new files.
  # Runs apart from the web app so web restarts never cut an import; the web page only shows its progress.
  telegram:
    image: nexdrive-app
    command: ["node","dist/telegram-service.js"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-nexdrive}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-nexdrive}
      SESSION_SECRET: ${SESSION_SECRET}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-268435456}
      STORAGE_DIR: /data
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_GROUP: ${TELEGRAM_GROUP:-}
      TELEGRAM_SESSION: /telegram/notesug
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-60}
      TELEGRAM_WORKSPACE_ID: ${TELEGRAM_WORKSPACE_ID:-}
      EDUSHARE_URL: ${EDUSHARE_URL:-}
      EDUSHARE_INTEGRATION_KEY: ${EDUSHARE_INTEGRATION_KEY:-}
    volumes:
      - ${STORAGE_HOST_PATH:-nexdrive_data}:/data
      - ${TELEGRAM_SESSION_HOST_PATH:-./data/telegram-session}:/telegram
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
  nexdrive_data:
