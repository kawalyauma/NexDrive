services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./.deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS:?Set CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    depends_on:
      app:
        condition: service_healthy
